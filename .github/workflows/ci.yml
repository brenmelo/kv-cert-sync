name: ci

# Static checks only. Nothing here touches Azure.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: terraform (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/modules/hub
          - terraform/modules/app_gateway
          - terraform/poc
          - terraform/production
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform fmt -check -recursive -diff
      - name: init (no backend)
        run: terraform init -backend=false -input=false
      - name: validate
        run: terraform validate

  python:
    name: python (offline tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -r src/sync/requirements.txt -r src/renew/requirements.txt
      - name: test
        run: python -m unittest discover -s tests -p "test_*.py"
